<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рулетка: цифры 1-6</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1b2233 0%, #0b0e14 60%, #05070a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 28px;
      background: linear-gradient(90deg, #00e5ff, #b14cff, #ff2e93);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
    }

    /* Лента рулетки */
    .roulette {
      position: relative;
      width: min(960px, 92vw);
      height: 180px;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(180deg, #10141d, #0a0d13);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(0, 229, 255, 0.08);
    }

    .roulette::before,
    .roulette::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; width: 120px; z-index: 3; pointer-events: none;
    }
    .roulette::before { left: 0; background: linear-gradient(90deg, #0a0d13, transparent); }
    .roulette::after { right: 0; background: linear-gradient(-90deg, #0a0d13, transparent); }

    .strip {
      position: absolute; top: 0; left: 0; height: 100%;
      display: flex; align-items: center; gap: 12px; padding: 0 12px;
      will-change: transform;
    }

    .card {
      flex: 0 0 auto;
      width: 140px; height: 130px;
      border-radius: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 8px;
      font-weight: 900; font-size: 64px; line-height: 1; color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.2s;
    }

    /* Редкости по цветам */
    .rare-common   { border-color: #8899aa; box-shadow: 0 0 10px rgba(136,153,170,0.3); }
    .rare-rare      { border-color: #2e8bff; box-shadow: 0 0 18px rgba(46,139,255,0.45); }
    .rare-epic      { border-color: #b14cff; box-shadow: 0 0 18px rgba(177,76,255,0.5); }
    .rare-legendary { border-color: #ffc531; box-shadow: 0 0 24px rgba(255,197,49,0.6); }
    .rare-mythic    { border-color: #ff2e93; box-shadow: 0 0 26px rgba(255,46,147,0.7); }
    .rare-divine    { border-color: #ffffff; box-shadow: 0 0 32px rgba(255,255,255,0.8); }

    .marker {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #00e5ff, #ff2e93);
      z-index: 4; box-shadow: 0 0 16px #00e5ff;
    }
    .marker::before {
      content: ''; position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent;
      border-top: 10px solid #00e5ff;
    }
    .marker::after {
      content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent;
      border-bottom: 10px solid #ff2e93;
    }

    #spinBtn {
      margin-top: 30px;
      padding: 16px 52px; font-size: 19px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: #05070a;
      background: linear-gradient(90deg, #00e5ff, #b14cff);
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.45);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    #spinBtn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(177, 76, 255, 0.6); }
    #spinBtn:disabled {
      filter: grayscale(0.6) brightness(0.7); cursor: not-allowed;
      box-shadow: none; transform: none;
    }

    #result {
      margin-top: 22px; font-size: 24px; letter-spacing: 1px;
      min-height: 32px; color: #cfd6e4;
    }
    #result b { font-size: 32px; }

    /* Оверлей «На весь экран» */
    #fsOverlay {
      position: fixed; inset: 0;
      background: rgba(3, 5, 9, 0.92);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 20px; z-index: 100; backdrop-filter: blur(6px);
    }
    #fsOverlay.hidden { display: none; }
    #fsBtn {
      padding: 18px 44px; font-size: 20px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: #05070a; background: #ffc531;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 197, 49, 0.5); transition: transform 0.15s;
    }
    #fsBtn:hover { transform: scale(1.04); }
  </style>
</head>
<body>
  <!-- Оверлей: кнопка «На весь экран» -->
  <div id="fsOverlay">
    <h2>Запустить на весь экран?</h2>
    <button id="fsBtn">На весь экран</button>
  </div>

  <h1>Рулетка цифр 1–6</h1>

  <div class="roulette">
    <div class="marker"></div>
    <div class="strip" id="strip"></div>
  </div>

  <button id="spinBtn">Крутить</button>
  <div id="result"></div>

  <script>
    // 6 чисел с редкостями
    const ITEMS = [
      { num: '1', rarity: 'rare-common',   label: 'Обычная' },
      { num: '2', rarity: 'rare-rare',     label: 'Редкая' },
      { num: '3', rarity: 'rare-epic',     label: 'Эпическая' },
      { num: '4', rarity: 'rare-legendary', label: 'Легендарная' },
      { num: '5', rarity: 'rare-mythic',    label: 'Мифическая' },
      { num: '6', rarity: 'rare-divine',   label: 'Божественная' }
    ];

    const strip     = document.getElementById('strip');
    const spinBtn   = document.getElementById('spinBtn');
    const resultEl  = document.getElementById('result');
    const fsBtn     = document.getElementById('fsBtn');
    const fsOverlay = document.getElementById('fsOverlay');

    const CARD_W = 140;
    const GAP    = 12;
    const STEP   = CARD_W + GAP;
    const REPEAT = 12; // повторений для «бесконечной» ленты

    function buildStrip() {
      strip.innerHTML = '';
      for (let i = 0; i < REPEAT; i++) {
        ITEMS.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'card ' + item.rarity;
          card.dataset.index = idx;
          card.textContent = item.num;
          strip.appendChild(card);
        });
      }
    }
    buildStrip();

    // Полноэкранный режим
    fsBtn.addEventListener('click', () => {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    });

    function updateFsOverlay() {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      fsOverlay.classList.toggle('hidden', !!isFs);
    }
    document.addEventListener('fullscreenchange', updateFsOverlay);
    document.addEventListener('webkitfullscreenchange', updateFsOverlay);
    updateFsOverlay();

    // Кручение 5 секунд
    const SPIN_TIME = 5000;

    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      resultEl.textContent = '';

      strip.style.transition = 'none';
      strip.style.transform = 'translateX(0)';

      // Равновероятный рандом (каждое число ~16.7%)
      const winIndex = Math.floor(Math.random() * ITEMS.length);

      const repeatBlock = Math.floor(REPEAT / 2);
      const targetSlot = repeatBlock * ITEMS.length + winIndex;

      const rouletteEl = document.querySelector('.roulette');
      const viewportW = rouletteEl.clientWidth;
      const startPadding = 12;
      const targetCenter = startPadding + targetSlot * STEP + CARD_W / 2;
      const offset = viewportW / 2 - targetCenter;

      // Лёгкий джиттер для естественности
      const jitter = (Math.random() - 0.5) * (CARD_W * 0.5);
      const finalX = offset + jitter;

      void strip.offsetWidth;

      // Эффект рулетки: сначала быстро, потом медленно
      strip.style.transition = `transform ${SPIN_TIME}ms cubic-bezier(0.12, 0.78, 0.18, 1)`;
      strip.style.transform = `translateX(${finalX}px)`;

      setTimeout(() => {
        const won = ITEMS[winIndex];
        resultEl.innerHTML = `Выпало: <b style="color:#00e5ff">${won.num}</b> — <span class="${won.rarity}">${won.label}</span>`;
        spinBtn.disabled = false;
      }, SPIN_TIME + 80);
    });
  </script>
</body>
</html>
